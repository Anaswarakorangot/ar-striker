<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Football Striker Exhibit</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/USDZExporter.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #060a12;
      color: #f1f5f9;
      padding: 1.25rem 1rem 2rem;
      overflow-x: hidden;
    }
    body.ar-lock-scroll {
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
    }
    .container { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }
    .eyebrow { font-size: 0.75rem; letter-spacing: 0.14em; color: #00f0ff; font-weight: 700; margin: 0 0 0.4rem; }
    h1 { margin: 0 0 0.5rem; font-size: 1.8rem; }
    .subtitle { margin: 0; color: #94a3b8; font-size: 0.94rem; line-height: 1.5; }
    .viewer-card { background: #0d1424; border: 1px solid rgba(0,240,255,0.25); border-radius: 16px; padding: 1.15rem; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.9rem; }
    .status-badge { display: inline-flex; gap: 0.5rem; align-items: center; font-size: 0.74rem; background: #111827; padding: 0.35rem 0.75rem; border-radius: 999px; border: 1px solid #1e293b; }
    .status-badge strong { color: #00f0ff; }
    .ar-actions { display: flex; gap: 0.45rem; }
    .ar-btn { background: #00f0ff; color: #050811; border: none; padding: 0.48rem 1rem; border-radius: 999px; font-weight: 700; font-size: 0.78rem; cursor: pointer; box-shadow: 0 0 16px rgba(0,240,255,0.35); }
    .quicklook-btn { background: #1e293b; color: #cbd5e1; text-decoration: none; padding: 0.48rem 0.85rem; border-radius: 999px; font-size: 0.75rem; border: 1px solid #334155; }

    #canvas-wrapper {
      position: relative;
      width: 100%;
      height: 390px;
      min-height: 390px;
      background: radial-gradient(circle at 50% 45%, #132238 0%, #080d18 72%, #050811 100%);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1rem;
      touch-action: none;
    }
    /* Fullscreen True Camera Superimpose Mode */
    #canvas-wrapper.ar-fullscreen-active {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      z-index: 9999 !important;
      border-radius: 0 !important;
      background: #000 !important;
      margin: 0 !important;
    }
    #ar-camera-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 1;
      pointer-events: none;
    }
    #canvas-wrapper.ar-fullscreen-active #ar-camera-video {
      display: block !important;
    }
    #canvas-wrapper canvas {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100% !important;
      height: 100% !important;
      display: block;
      background: transparent !important;
    }

    .ar-top-hud {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      z-index: 30;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      pointer-events: none;
    }
    .ar-reticle-hint {
      background: rgba(10, 15, 28, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.45);
      color: #00f0ff;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      backdrop-filter: blur(8px);
    }
    .exit-ar-btn {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      border: 1px solid #475569;
      padding: 0.5rem 1.05rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    /* Bottom AR HUD Bar */
    .live-ar-hud {
      position: absolute;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      background: rgba(10, 15, 28, 0.88);
      border: 1px solid rgba(0, 240, 255, 0.4);
      padding: 0.85rem;
      border-radius: 18px;
      backdrop-filter: blur(12px);
    }
    .ar-place-bar {
      display: flex;
      gap: 0.5rem;
    }
    .ar-action-pair {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.65rem;
    }
    .controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-bottom: 0.75rem; }
    .btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 0.75rem;
      border-radius: 12px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 700;
      text-align: center;
      user-select: none;
    }
    .btn:active { transform: scale(0.97); }
    .btn.primary {
      background: rgba(0, 240, 255, 0.2);
      border-color: #00f0ff;
      color: #00f0ff;
    }
    .btn.place-btn {
      flex: 1;
      background: #00f0ff;
      color: #041019;
      border: none;
      padding: 0.6rem;
      font-size: 0.82rem;
    }
    .action-status { font-size: 0.8rem; color: #00f0ff; font-weight: 600; margin: 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="container">
    <header class="hero">
      <p class="eyebrow">XR SPORTS ARENA • MOBILE EXHIBIT</p>
      <h1>AR Football Striker Exhibit</h1>
      <p class="subtitle">
        Point your camera at the floor in Live AR to superimpose the striker in your space, then use the Jump and Kick buttons.
      </p>
    </header>

    <section class="viewer-card">
      <div class="top-bar">
        <div class="status-badge">
          <span>STRIKER UNIT</span>
          <strong id="player-state-badge">READY</strong>
        </div>
        <div class="ar-actions">
          <button id="launch-live-ar-btn" class="ar-btn" type="button">View in AR</button>
          <a id="ar-quicklook-link" rel="ar" href="striker-unit.usdz" download="striker-unit.usdz" class="quicklook-btn">
            <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" style="width:1px;height:1px;opacity:0;position:absolute;pointer-events:none;" />
            <span>iOS Quick Look</span>
          </a>
        </div>
      </div>

      <div id="canvas-wrapper">
        <video id="ar-camera-video" playsinline webkit-playsinline muted autoplay></video>

        <div id="ar-top-hud" class="ar-top-hud hidden">
          <div id="ar-reticle-hint" class="ar-reticle-hint">Aim at floor & tap Place Here</div>
          <button id="exit-live-ar-btn" class="exit-ar-btn" type="button">Exit AR</button>
        </div>

        <!-- AR Screen Controls: Lock to Floor + Jump & Kick -->
        <div id="live-ar-hud" class="live-ar-hud hidden">
          <div class="ar-place-bar">
            <button id="ar-lock-floor-btn" class="btn place-btn" type="button">Place on Floor Here</button>
          </div>
          <div class="ar-action-pair">
            <button id="ar-hud-jump-btn" class="btn primary" type="button">Jump</button>
            <button id="ar-hud-kick-btn" class="btn primary" type="button">Kick</button>
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="jump-btn" class="btn primary" type="button">Jump</button>
        <button id="kick-btn" class="btn primary" type="button">Kick</button>
        <button id="toggle-rotate-btn" class="btn" type="button">Auto-rotate: On</button>
        <button id="reset-camera-btn" class="btn" type="button">Reset camera</button>
      </div>

      <p id="action-status" class="action-status">STRIKER READY</p>
    </section>
  </main>

  <script>
    (function () {
      const canvasWrapper = document.getElementById('canvas-wrapper');
      const arVideo = document.getElementById('ar-camera-video');
      const arTopHud = document.getElementById('ar-top-hud');
      const arReticleHint = document.getElementById('ar-reticle-hint');

      const launchLiveArBtn = document.getElementById('launch-live-ar-btn');
      const exitLiveArBtn = document.getElementById('exit-live-ar-btn');
      const liveArHud = document.getElementById('live-ar-hud');
      const arLockFloorBtn = document.getElementById('ar-lock-floor-btn');
      const arQuickLookLink = document.getElementById('ar-quicklook-link');

      const jumpBtn = document.getElementById('jump-btn');
      const kickBtn = document.getElementById('kick-btn');
      const rotateBtn = document.getElementById('toggle-rotate-btn');
      const resetCameraBtn = document.getElementById('reset-camera-btn');

      const arHudJumpBtn = document.getElementById('ar-hud-jump-btn');
      const arHudKickBtn = document.getElementById('ar-hud-kick-btn');

      const playerStateBadge = document.getElementById('player-state-badge');
      const actionStatus = document.getElementById('action-status');

      let isAutoRotating = true;
      let isLiveArActive = false;
      let isFloorLocked = false;
      let cameraStream = null;
      let compiledUsdzBlobUrl = null;

      // Full 3D Quaternion Device Orientation Tracker for Real World Superimposing
      const deviceQuat = new THREE.Quaternion();
      const hasGyroData = { active: false, alpha: 0, beta: 70, gamma: 0 };
      const zee = new THREE.Vector3(0, 0, 1);
      const euler = new THREE.Euler();
      const q0 = new THREE.Quaternion();
      const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // -PI/2 around X

      function setObjectQuaternion(quaternion, alpha, beta, gamma, orient) {
        euler.set(beta, alpha, -gamma, 'YXZ');
        quaternion.setFromEuler(euler);
        quaternion.multiply(q1);
        quaternion.multiply(q0.setFromAxisAngle(zee, -orient));
      }

      // Jump Animation State
      const jumpAnim = {
        active: false,
        startTime: 0,
        duration: 950
      };

      // Kick Animation State (2000ms = 2 seconds hold before respawn)
      const kickAnim = {
        active: false,
        startTime: 0,
        strikeTime: 300,
        flightDuration: 550,
        waitDuration: 2000
      };

      // Football positioned directly in front of the right kicking foot (x = -0.11, z = 0.22)
      const BALL_HOME_POS = new THREE.Vector3(-0.11, 0.22, 0.22);
      const BALL_TARGET_POS = new THREE.Vector3(-0.11, 0.22, 3.65);

      const initWidth = canvasWrapper.clientWidth || 480;
      const initHeight = canvasWrapper.clientHeight || 390;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(52, initWidth / initHeight, 0.05, 100);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        premultipliedAlpha: false,
        powerPreference: 'high-performance'
      });
      renderer.setClearColor(0x000000, 0);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.setSize(initWidth, initHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      canvasWrapper.appendChild(renderer.domElement);

      const orbitState = {
        theta: 0.35,
        phi: 1.18,
        radius: 4.8,
        target: new THREE.Vector3(0, 0.9, 0),
        isDragging: false,
        dragMoved: false,
        lastX: 0,
        lastY: 0,
        pinchDist: 0,
        modelScale: 1.0,
        modelYaw: 0
      };

      function updatePreviewCamera() {
        orbitState.phi = Math.max(0.25, Math.min(Math.PI / 2 + 0.05, orbitState.phi));
        orbitState.radius = Math.max(2.0, Math.min(12.0, orbitState.radius));

        const sinPhiRadius = Math.sin(orbitState.phi) * orbitState.radius;
        camera.position.x = orbitState.target.x + sinPhiRadius * Math.sin(orbitState.theta);
        camera.position.y = orbitState.target.y + Math.cos(orbitState.phi) * orbitState.radius;
        camera.position.z = orbitState.target.z + sinPhiRadius * Math.cos(orbitState.theta);
        camera.lookAt(orbitState.target);
      }
      updatePreviewCamera();

      // Lighting + Real AR Floor Shadow Light
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.15);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xfffbeb, 2.1);
      keyLight.position.set(2.5, 6, 3.5);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 1024;
      keyLight.shadow.mapSize.height = 1024;
      keyLight.shadow.camera.near = 0.5;
      keyLight.shadow.camera.far = 20;
      const d = 4;
      keyLight.shadow.camera.left = -d;
      keyLight.shadow.camera.right = d;
      keyLight.shadow.camera.top = d;
      keyLight.shadow.camera.bottom = -d;
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0x00f0ff, 1.2);
      rimLight.position.set(-4, 4, -3);
      scene.add(rimLight);

      function createBakedBox(w, h, d, tx = 0, ty = 0, tz = 0) {
        const geom = new THREE.BoxGeometry(w, h, d);
        geom.translate(tx, ty, tz);
        return geom;
      }

      function createBakedSphere(radius, sx = 1, sy = 1, sz = 1) {
        const geom = new THREE.SphereGeometry(radius, 24, 18);
        geom.scale(sx, sy, sz);
        return geom;
      }

      // Root Exhibit Group
      const exhibitGroup = new THREE.Group();
      scene.add(exhibitGroup);

      // Transparent AR Floor Shadow-Catcher Plane (Makes character look grounded on real floor)
      const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.42 });
      const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), shadowPlaneMat);
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.y = 0.002;
      shadowPlane.receiveShadow = true;
      exhibitGroup.add(shadowPlane);

      // AR Floor Target Reticle (Shown while aiming at floor in AR)
      const reticleGroup = new THREE.Group();
      reticleGroup.visible = false;
      scene.add(reticleGroup);

      const reticleOuter = new THREE.Mesh(
        new THREE.RingGeometry(0.42, 0.48, 48),
        new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide })
      );
      reticleOuter.rotation.x = -Math.PI / 2;
      reticleOuter.position.y = 0.01;
      reticleGroup.add(reticleOuter);

      const reticleInner = new THREE.Mesh(
        new THREE.RingGeometry(0.08, 0.12, 32),
        new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide })
      );
      reticleInner.rotation.x = -Math.PI / 2;
      reticleInner.position.y = 0.01;
      reticleGroup.add(reticleInner);

      // 1. Arena Base Platform
      const platformGroup = new THREE.Group();
      exhibitGroup.add(platformGroup);

      const baseMat = new THREE.MeshStandardMaterial({
        color: 0x0f172a,
        roughness: 0.35,
        metalness: 0.6
      });
      const baseDisc = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.22, 0.08, 48), baseMat);
      baseDisc.position.y = 0.04;
      baseDisc.receiveShadow = true;
      platformGroup.add(baseDisc);

      const rimMat = new THREE.MeshStandardMaterial({
        color: 0x00f0ff,
        emissive: 0x00f0ff,
        emissiveIntensity: 0.55,
        roughness: 0.2,
        metalness: 0.3
      });
      const outerRing = new THREE.Mesh(new THREE.TorusGeometry(1.16, 0.03, 16, 64), rimMat);
      outerRing.rotation.x = Math.PI / 2;
      outerRing.position.y = 0.08;
      platformGroup.add(outerRing);

      const ballSpotRingMat = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        emissive: 0x00f0ff,
        emissiveIntensity: 0.4,
        roughness: 0.3
      });
      const ballSpotRing = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.014, 12, 32), ballSpotRingMat);
      ballSpotRing.rotation.x = Math.PI / 2;
      ballSpotRing.position.set(BALL_HOME_POS.x, 0.085, BALL_HOME_POS.z);
      platformGroup.add(ballSpotRing);

      // 2. Human Football Striker
      const strikerRoot = new THREE.Group();
      strikerRoot.position.set(0, 0.08, -0.10);
      exhibitGroup.add(strikerRoot);

      const skinMat = new THREE.MeshStandardMaterial({ color: 0xe0a97f, roughness: 0.55, metalness: 0.05 });
      const hairMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.4, metalness: 0.1 });
      const kitMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.35, metalness: 0.2 });
      const trimMat = new THREE.MeshStandardMaterial({
        color: 0x00f0ff,
        emissive: 0x00f0ff,
        emissiveIntensity: 0.45,
        roughness: 0.25
      });
      const shortsMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.45, metalness: 0.15 });
      const sockMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.5, metalness: 0.05 });
      const bootMat = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.3, metalness: 0.4 });

      const hipsGroup = new THREE.Group();
      hipsGroup.position.set(0, 0.78, 0);
      strikerRoot.add(hipsGroup);

      const pelvisMesh = new THREE.Mesh(createBakedBox(0.38, 0.16, 0.22), shortsMat);
      pelvisMesh.castShadow = true;
      hipsGroup.add(pelvisMesh);

      const torsoGroup = new THREE.Group();
      torsoGroup.position.set(0, 0.08, 0);
      hipsGroup.add(torsoGroup);

      const chestMesh = new THREE.Mesh(createBakedBox(0.44, 0.48, 0.24, 0, 0.24, 0), kitMat);
      chestMesh.castShadow = true;
      torsoGroup.add(chestMesh);

      const emblemMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.02, 24), trimMat);
      emblemMesh.rotation.x = Math.PI / 2;
      emblemMesh.position.set(0, 0.28, 0.125);
      torsoGroup.add(emblemMesh);

      const headGroup = new THREE.Group();
      headGroup.position.set(0, 0.52, 0);
      torsoGroup.add(headGroup);

      const neckMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.075, 0.1, 16), skinMat);
      neckMesh.position.y = 0.04;
      headGroup.add(neckMesh);

      const headSkull = new THREE.Mesh(createBakedSphere(0.16, 1, 1.08, 1), skinMat);
      headSkull.position.y = 0.21;
      headSkull.castShadow = true;
      headGroup.add(headSkull);

      const hairCap = new THREE.Mesh(createBakedSphere(0.166, 1.02, 0.85, 1.03), hairMat);
      hairCap.position.set(0, 0.26, -0.01);
      headGroup.add(hairCap);

      const headband = new THREE.Mesh(new THREE.TorusGeometry(0.158, 0.016, 12, 32), trimMat);
      headband.rotation.x = Math.PI / 2 - 0.12;
      headband.position.set(0, 0.26, 0.01);
      headGroup.add(headband);

      function createArm(isLeft) {
        const dir = isLeft ? 1 : -1;
        const shoulderPivot = new THREE.Group();
        shoulderPivot.position.set(dir * 0.27, 0.43, 0);
        torsoGroup.add(shoulderPivot);

        const shoulderPad = new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 16), kitMat);
        shoulderPad.castShadow = true;
        shoulderPivot.add(shoulderPad);

        const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.046, 0.36, 16), skinMat);
        upperArm.position.y = -0.2;
        upperArm.castShadow = true;
        shoulderPivot.add(upperArm);

        const wristband = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.045, 16), trimMat);
        wristband.position.y = -0.36;
        shoulderPivot.add(wristband);

        const hand = new THREE.Mesh(new THREE.SphereGeometry(0.052, 14, 14), skinMat);
        hand.position.y = -0.42;
        shoulderPivot.add(hand);

        return shoulderPivot;
      }

      const leftArm = createArm(true);
      const rightArm = createArm(false);

      function createLeg(isLeft) {
        const dir = isLeft ? 1 : -1;
        const hipPivot = new THREE.Group();
        hipPivot.position.set(dir * 0.11, -0.04, 0);
        hipsGroup.add(hipPivot);

        const thighShort = new THREE.Mesh(new THREE.CylinderGeometry(0.082, 0.074, 0.22, 16), shortsMat);
        thighShort.position.y = -0.11;
        thighShort.castShadow = true;
        hipPivot.add(thighShort);

        const thighSkin = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.18, 16), skinMat);
        thighSkin.position.y = -0.27;
        thighSkin.castShadow = true;
        hipPivot.add(thighSkin);

        const kneePivot = new THREE.Group();
        kneePivot.position.set(0, -0.36, 0);
        hipPivot.add(kneePivot);

        const shinSock = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.32, 16), sockMat);
        shinSock.position.y = -0.16;
        shinSock.castShadow = true;
        kneePivot.add(shinSock);

        const shinGuard = new THREE.Mesh(createBakedBox(0.055, 0.16, 0.03), trimMat);
        shinGuard.position.set(0, -0.16, 0.05);
        kneePivot.add(shinGuard);

        const bootMesh = new THREE.Mesh(createBakedBox(0.11, 0.08, 0.22, 0, -0.34, 0.04), bootMat);
        bootMesh.castShadow = true;
        kneePivot.add(bootMesh);

        const bootSole = new THREE.Mesh(createBakedBox(0.114, 0.02, 0.226, 0, -0.375, 0.04), trimMat);
        kneePivot.add(bootSole);

        return { hipPivot, kneePivot };
      }

      const leftLeg = createLeg(true);
      const rightLeg = createLeg(false);

      // 3. Football (Aligned right in front of the right kicking foot)
      const footballGroup = new THREE.Group();
      footballGroup.position.copy(BALL_HOME_POS);
      exhibitGroup.add(footballGroup);

      const ballCoreMat = new THREE.MeshStandardMaterial({
        color: 0xf8fafc,
        roughness: 0.25,
        metalness: 0.1
      });
      const ballSphere = new THREE.Mesh(new THREE.SphereGeometry(0.14, 28, 28), ballCoreMat);
      ballSphere.castShadow = true;
      footballGroup.add(ballSphere);

      const panelMat = new THREE.MeshStandardMaterial({
        color: 0x0f172a,
        roughness: 0.35,
        metalness: 0.2
      });

      const patchCount = 12;
      const phiGold = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < patchCount; i++) {
        const y = 1 - (i / (patchCount - 1)) * 2;
        const radiusAtY = Math.sqrt(1 - y * y);
        const theta = phiGold * i;
        const x = Math.cos(theta) * radiusAtY;
        const z = Math.sin(theta) * radiusAtY;

        const patch = new THREE.Mesh(new THREE.CylinderGeometry(0.046, 0.046, 0.015, 5), panelMat);
        const normal = new THREE.Vector3(x, y, z).normalize();
        patch.position.copy(normal).multiplyScalar(0.136);
        patch.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
        footballGroup.add(patch);
      }

      function resetStrikerPose() {
        hipsGroup.position.set(0, 0.78, 0);
        hipsGroup.rotation.set(0, 0, 0);
        torsoGroup.rotation.set(0, 0, 0);
        leftArm.rotation.set(0, 0, 0.12);
        rightArm.rotation.set(0, 0, -0.12);
        leftLeg.hipPivot.rotation.set(0, 0, 0);
        leftLeg.kneePivot.rotation.set(0, 0, 0);
        rightLeg.hipPivot.rotation.set(0, 0, 0);
        rightLeg.kneePivot.rotation.set(0, 0, 0);
      }
      resetStrikerPose();

      // Raycaster for Floor Locking
      const raycaster = new THREE.Raycaster();
      const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
      const hitPoint = new THREE.Vector3();

      // Place model at current floor reticle position
      function lockModelToFloorReticle() {
        exhibitGroup.position.copy(reticleGroup.position);
        // Face the camera horizontally
        const camPos = camera.position;
        const angleToCam = Math.atan2(camPos.x - exhibitGroup.position.x, camPos.z - exhibitGroup.position.z);
        orbitState.modelYaw = angleToCam;
        exhibitGroup.rotation.y = orbitState.modelYaw;
        isFloorLocked = true;
        reticleGroup.visible = false;
        if (arReticleHint) arReticleHint.textContent = 'Locked to floor • Drag to rotate • Pinch to scale';
        if (arLockFloorBtn) arLockFloorBtn.textContent = 'Move / Re-place on Floor';
      }

      if (arLockFloorBtn) {
        arLockFloorBtn.addEventListener('click', () => {
          if (!isFloorLocked) {
            lockModelToFloorReticle();
          } else {
            // Unlock so user can aim reticle at a new floor spot
            isFloorLocked = false;
            reticleGroup.visible = true;
            if (arReticleHint) arReticleHint.textContent = 'Aim at floor & tap Place Here';
            arLockFloorBtn.textContent = 'Place on Floor Here';
          }
        });
      }

      // Pointer & Touch Controls
      const domElem = renderer.domElement;

      domElem.addEventListener('pointerdown', (e) => {
        orbitState.isDragging = true;
        orbitState.dragMoved = false;
        orbitState.lastX = e.clientX;
        orbitState.lastY = e.clientY;
      });

      window.addEventListener('pointermove', (e) => {
        if (!orbitState.isDragging) return;
        const dx = e.clientX - orbitState.lastX;
        const dy = e.clientY - orbitState.lastY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) orbitState.dragMoved = true;
        orbitState.lastX = e.clientX;
        orbitState.lastY = e.clientY;

        if (isLiveArActive) {
          // Rotate character on floor when dragging in AR
          orbitState.modelYaw += dx * 0.012;
          exhibitGroup.rotation.y = orbitState.modelYaw;
        } else {
          orbitState.theta -= dx * 0.008;
          orbitState.phi -= dy * 0.008;
          updatePreviewCamera();
        }
      });

      window.addEventListener('pointerup', (e) => {
        if (orbitState.isDragging && !orbitState.dragMoved && isLiveArActive) {
          // Tapping directly on the floor in AR places the character at that floor point
          const rect = domElem.getBoundingClientRect();
          const ndcX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          const ndcY = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
          if (raycaster.ray.intersectPlane(floorPlane, hitPoint)) {
            if (hitPoint.length() < 14) {
              reticleGroup.position.copy(hitPoint);
              lockModelToFloorReticle();
            }
          }
        }
        orbitState.isDragging = false;
      });

      domElem.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          orbitState.isDragging = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          orbitState.pinchDist = Math.hypot(dx, dy);
        }
      }, { passive: true });

      domElem.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          if (orbitState.pinchDist > 0) {
            const delta = dist - orbitState.pinchDist;
            if (isLiveArActive) {
              orbitState.modelScale = Math.max(0.35, Math.min(2.2, orbitState.modelScale + delta * 0.004));
              exhibitGroup.scale.setScalar(orbitState.modelScale);
            } else {
              orbitState.radius -= delta * 0.015;
              updatePreviewCamera();
            }
          }
          orbitState.pinchDist = dist;
        }
      }, { passive: true });

      // DeviceOrientation Listener for True 3D World-Locked AR Camera
      window.addEventListener('deviceorientation', (e) => {
        if (e.alpha === null || e.beta === null || e.gamma === null) return;
        hasGyroData.active = true;
        hasGyroData.alpha = e.alpha;
        hasGyroData.beta = e.beta;
        hasGyroData.gamma = e.gamma;
      });

      // Jump & Kick Triggers
      function triggerJump() {
        if (jumpAnim.active) return;
        jumpAnim.active = true;
        jumpAnim.startTime = performance.now();
        if (playerStateBadge) playerStateBadge.textContent = 'JUMPING';
        if (actionStatus) actionStatus.textContent = 'ACTION: JUMP';
      }

      function triggerKick() {
        if (kickAnim.active) return;
        kickAnim.active = true;
        kickAnim.startTime = performance.now();
        if (playerStateBadge) playerStateBadge.textContent = 'KICKING';
        if (actionStatus) actionStatus.textContent = 'ACTION: KICK';
      }

      if (jumpBtn) jumpBtn.addEventListener('click', triggerJump);
      if (arHudJumpBtn) arHudJumpBtn.addEventListener('click', triggerJump);

      if (kickBtn) kickBtn.addEventListener('click', triggerKick);
      if (arHudKickBtn) arHudKickBtn.addEventListener('click', triggerKick);

      if (rotateBtn) {
        rotateBtn.addEventListener('click', () => {
          isAutoRotating = !isAutoRotating;
          rotateBtn.textContent = isAutoRotating ? 'Auto-rotate: On' : 'Auto-rotate: Off';
        });
      }

      function resetView() {
        orbitState.theta = 0.35;
        orbitState.phi = 1.18;
        orbitState.radius = 4.8;
        orbitState.target.set(0, 0.9, 0);
        orbitState.modelScale = 1.0;
        orbitState.modelYaw = 0;
        exhibitGroup.position.set(0, 0, 0);
        exhibitGroup.rotation.set(0, 0, 0);
        exhibitGroup.scale.set(1, 1, 1);
        updatePreviewCamera();
        if (actionStatus) actionStatus.textContent = 'CAMERA RESET';
      }

      if (resetCameraBtn) resetCameraBtn.addEventListener('click', resetView);

      // Start Live Camera AR with World-Locked Floor Superimposition
      async function startLiveCameraAR() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            await DeviceOrientationEvent.requestPermission();
          } catch (e) {
            console.warn('Gyro permission notice:', e);
          }
        }

        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            cameraStream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: { ideal: 'environment' },
                width: { ideal: 1920 },
                height: { ideal: 1080 }
              },
              audio: false
            });
            arVideo.srcObject = cameraStream;
            await arVideo.play();
          }
        } catch (err) {
          console.warn('Camera stream notice:', err);
        }

        isLiveArActive = true;
        isFloorLocked = false;
        document.body.classList.add('ar-lock-scroll');

        // Hide dark solid disc so character stands directly on real floor tiles with real ground shadow
        baseDisc.visible = false;
        outerRing.visible = true;
        reticleGroup.visible = true;

        canvasWrapper.classList.add('ar-fullscreen-active');
        if (arTopHud) arTopHud.classList.remove('hidden');
        if (liveArHud) liveArHud.classList.remove('hidden');
        if (arLockFloorBtn) arLockFloorBtn.textContent = 'Place on Floor Here';
        if (arReticleHint) arReticleHint.textContent = 'Aim at floor & tap Place on Floor Here';

        // Set AR camera at standing eye height (1.35m above floor y=0)
        camera.position.set(0, 1.35, 0);
        camera.lookAt(0, 0, -2.6);

        orbitState.modelScale = 0.72;
        exhibitGroup.scale.setScalar(orbitState.modelScale);
        exhibitGroup.position.set(0, 0, -2.6);
        reticleGroup.position.set(0, 0, -2.6);

        handleResize();
      }

      function stopLiveCameraAR() {
        isLiveArActive = false;
        isFloorLocked = false;
        document.body.classList.remove('ar-lock-scroll');
        baseDisc.visible = true;
        reticleGroup.visible = false;

        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
          cameraStream = null;
        }
        if (arVideo) arVideo.srcObject = null;

        canvasWrapper.classList.remove('ar-fullscreen-active');
        if (arTopHud) arTopHud.classList.add('hidden');
        if (liveArHud) liveArHud.classList.add('hidden');
        resetView();
        handleResize();
      }

      if (launchLiveArBtn) launchLiveArBtn.addEventListener('click', startLiveCameraAR);
      if (exitLiveArBtn) exitLiveArBtn.addEventListener('click', stopLiveCameraAR);

      // Compile updated striker-unit.usdz with centered football
      async function compileUsdzModel() {
        try {
          if (window.THREE && window.THREE.USDZExporter) {
            const prevDiscVis = baseDisc.visible;
            baseDisc.visible = true;

            const exportClone = exhibitGroup.clone(true);
            exportClone.position.set(0, 0, 0);
            exportClone.rotation.set(0, 0, 0);
            exportClone.scale.set(1, 1, 1);
            exportClone.updateMatrixWorld(true);

            baseDisc.visible = prevDiscVis;

            // Remove shadow-catcher plane from USDZ export
            const toRemove = [];
            exportClone.traverse((node) => {
              if (node.material && node.material.isShadowMaterial) {
                toRemove.push(node);
              }
            });
            toRemove.forEach((n) => n.parent && n.parent.remove(n));

            const SCALE_FACTOR = 0.24;
            exportClone.traverse((node) => {
              if (node.isMesh && node.geometry) {
                node.geometry = node.geometry.clone();
                node.geometry.scale(SCALE_FACTOR, SCALE_FACTOR, SCALE_FACTOR);
              }
              if (node !== exportClone && node.position) {
                node.position.multiplyScalar(SCALE_FACTOR);
              }
            });
            exportClone.updateMatrixWorld(true);

            const exporter = new THREE.USDZExporter();
            const arrayBuffer = await exporter.parse(exportClone);
            const blob = new Blob([arrayBuffer], { type: 'model/vnd.usdz+zip' });
            if (compiledUsdzBlobUrl) URL.revokeObjectURL(compiledUsdzBlobUrl);
            compiledUsdzBlobUrl = URL.createObjectURL(blob);

            if (arQuickLookLink) {
              arQuickLookLink.href = compiledUsdzBlobUrl;
              arQuickLookLink.setAttribute('download', 'striker-unit.usdz');
            }
          }
        } catch (e) {
          console.warn('USDZ compile warning:', e);
        }
      }
      compileUsdzModel();

      function handleResize() {
        const w = isLiveArActive ? window.innerWidth : (canvasWrapper.clientWidth || 480);
        const h = isLiveArActive ? window.innerHeight : (canvasWrapper.clientHeight || 390);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      window.addEventListener('resize', handleResize);
      setTimeout(handleResize, 60);

      // Main Animation Loop
      function animate(now) {
        requestAnimationFrame(animate);

        if (isLiveArActive) {
          // 1. Update Camera from 3D Gyroscope Quaternion so floor stays locked in real space
          if (hasGyroData.active) {
            const alpha = THREE.MathUtils.degToRad(hasGyroData.alpha);
            const beta = THREE.MathUtils.degToRad(hasGyroData.beta);
            const gamma = THREE.MathUtils.degToRad(hasGyroData.gamma);
            const orient = window.screen && window.screen.orientation && window.screen.orientation.angle
              ? THREE.MathUtils.degToRad(window.screen.orientation.angle)
              : THREE.MathUtils.degToRad(window.orientation || 0);

            setObjectQuaternion(deviceQuat, alpha, beta, gamma, orient);
            camera.quaternion.slerp(deviceQuat, 0.25);
          }

          // 2. Raycast from screen center onto floor plane (y = 0) while aiming
          if (!isFloorLocked) {
            raycaster.setFromCamera({ x: 0, y: -0.15 }, camera);
            if (raycaster.ray.intersectPlane(floorPlane, hitPoint)) {
              const dist = hitPoint.length();
              if (dist > 0.6 && dist < 9.0) {
                reticleGroup.position.lerp(hitPoint, 0.25);
                exhibitGroup.position.copy(reticleGroup.position);
              }
            }
            const pulse = 1 + Math.sin(now * 0.008) * 0.08;
            reticleOuter.scale.setScalar(pulse);
          }
        } else {
          // Standard 3D Preview Orbit
          if (isAutoRotating && !orbitState.isDragging) {
            orbitState.theta += 0.0055;
            updatePreviewCamera();
          }
        }

        // Idle Breathing
        if (!jumpAnim.active && !kickAnim.active) {
          const breath = Math.sin(now * 0.003) * 0.015;
          hipsGroup.position.y = 0.78 + breath;
          leftArm.rotation.x = Math.sin(now * 0.003) * 0.06;
          rightArm.rotation.x = -Math.sin(now * 0.003) * 0.06;
        }

        // JUMP ANIMATION
        if (jumpAnim.active) {
          const elapsed = now - jumpAnim.startTime;
          const t = Math.min(elapsed / jumpAnim.duration, 1);

          if (t < 0.22) {
            const p = t / 0.22;
            hipsGroup.position.y = 0.78 - p * 0.16;
            torsoGroup.rotation.x = p * 0.22;
            leftLeg.hipPivot.rotation.x = -p * 0.45;
            leftLeg.kneePivot.rotation.x = p * 0.85;
            rightLeg.hipPivot.rotation.x = -p * 0.45;
            rightLeg.kneePivot.rotation.x = p * 0.85;
            leftArm.rotation.x = p * 0.45;
            rightArm.rotation.x = p * 0.45;
          } else if (t < 0.76) {
            const p = (t - 0.22) / 0.54;
            const arc = Math.sin(p * Math.PI);
            hipsGroup.position.y = 0.62 + arc * 0.95;
            torsoGroup.rotation.x = 0.22 * (1 - p) - arc * 0.12;
            leftLeg.hipPivot.rotation.x = -0.25 * arc;
            leftLeg.kneePivot.rotation.x = 0.55 * arc;
            rightLeg.hipPivot.rotation.x = -0.25 * arc;
            rightLeg.kneePivot.rotation.x = 0.55 * arc;
            leftArm.rotation.x = -arc * 2.3;
            rightArm.rotation.x = -arc * 2.3;
          } else {
            const p = (t - 0.76) / 0.24;
            const recover = Math.sin(p * Math.PI);
            hipsGroup.position.y = 0.78 - recover * 0.12;
            torsoGroup.rotation.x = recover * 0.14;
            leftLeg.hipPivot.rotation.x = -recover * 0.3;
            leftLeg.kneePivot.rotation.x = recover * 0.6;
            rightLeg.hipPivot.rotation.x = -recover * 0.3;
            rightLeg.kneePivot.rotation.x = recover * 0.6;
            leftArm.rotation.x = 0;
            rightArm.rotation.x = 0;
          }

          if (t >= 1) {
            jumpAnim.active = false;
            resetStrikerPose();
            if (!kickAnim.active) {
              if (playerStateBadge) playerStateBadge.textContent = 'READY';
              if (actionStatus) actionStatus.textContent = 'STRIKER READY';
            }
          }
        }

        // KICK ANIMATION + 2 SECOND HOLD BEFORE RESPAWN
        if (kickAnim.active) {
          const elapsed = now - kickAnim.startTime;
          const strikeEnd = kickAnim.strikeTime;
          const flightEnd = strikeEnd + kickAnim.flightDuration;
          const totalEnd = flightEnd + kickAnim.waitDuration;

          if (elapsed < 180) {
            const p = elapsed / 180;
            rightLeg.hipPivot.rotation.x = p * 0.75;
            rightLeg.kneePivot.rotation.x = p * 0.65;
            torsoGroup.rotation.x = -p * 0.1;
            leftArm.rotation.x = -p * 0.5;
            rightArm.rotation.x = p * 0.4;
          } else if (elapsed < strikeEnd) {
            const p = (elapsed - 180) / (strikeEnd - 180);
            rightLeg.hipPivot.rotation.x = 0.75 - p * 1.65;
            rightLeg.kneePivot.rotation.x = 0.65 * (1 - p);
            torsoGroup.rotation.x = -0.1 + p * 0.22;
            leftArm.rotation.x = -0.5 + p * 0.8;
            rightArm.rotation.x = 0.4 - p * 0.7;
          } else if (elapsed < 650) {
            const p = (elapsed - strikeEnd) / 350;
            rightLeg.hipPivot.rotation.x = -0.9 * (1 - p);
            torsoGroup.rotation.x = 0.12 * (1 - p);
            leftArm.rotation.x = 0.3 * (1 - p);
            rightArm.rotation.x = -0.3 * (1 - p);
          } else if (!jumpAnim.active) {
            resetStrikerPose();
          }

          if (elapsed < strikeEnd) {
            footballGroup.position.copy(BALL_HOME_POS);
          } else if (elapsed < flightEnd) {
            const p = (elapsed - strikeEnd) / kickAnim.flightDuration;
            const easeOut = 1 - Math.pow(1 - p, 2.2);
            footballGroup.position.lerpVectors(BALL_HOME_POS, BALL_TARGET_POS, easeOut);
            const arcHeight = Math.sin(p * Math.PI) * 0.95;
            footballGroup.position.y = BALL_HOME_POS.y + arcHeight;
            footballGroup.rotation.x += 0.26;
            footballGroup.rotation.z -= 0.12;
          } else if (elapsed < totalEnd) {
            footballGroup.position.copy(BALL_TARGET_POS);
            if (actionStatus) actionStatus.textContent = 'BALL AT DISTANCE (RESPAWNING IN 2S)';
          } else {
            footballGroup.position.copy(BALL_HOME_POS);
            footballGroup.rotation.set(0, 0, 0);
            kickAnim.active = false;
            if (!jumpAnim.active) {
              if (playerStateBadge) playerStateBadge.textContent = 'READY';
              if (actionStatus) actionStatus.textContent = 'STRIKER READY';
            }
          }
        }

        renderer.render(scene, camera);
      }

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
